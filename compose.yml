services:
  cellumo:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4210:4210"
    environment:
      CELLUMO_ADMIN_TOKEN: ${CELLUMO_ADMIN_TOKEN:?set CELLUMO_ADMIN_TOKEN}
      CELLUMO_REGISTRATION_KEY: ${CELLUMO_REGISTRATION_KEY:?set CELLUMO_REGISTRATION_KEY}
    volumes:
      - cellumo-data:/app/data
volumes:
  cellumo-data: