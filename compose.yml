services:
  ohmium:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4210:4210"
    environment:
      OHMIUM_ADMIN_TOKEN: ${OHMIUM_ADMIN_TOKEN:?set OHMIUM_ADMIN_TOKEN}
      OHMIUM_REGISTRATION_KEY: ${OHMIUM_REGISTRATION_KEY:?set OHMIUM_REGISTRATION_KEY}
      OHMIUM_ALLOWED_ORIGIN: ${OHMIUM_ALLOWED_ORIGIN:-}
    volumes:
      - ohmium-data:/app/data
volumes:
  ohmium-data:
