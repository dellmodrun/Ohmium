name: Inspect Celino edge
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.OHMIUM_SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ vars.OHMIUM_SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/server
          chmod 600 ~/.ssh/server
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Inspect routes
        env:
          SERVER_HOST: ${{ vars.OHMIUM_SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/server root@"$SERVER_HOST" 'set -u
            cat /opt/cennomo/deploy/Caddyfile
            echo "--- ADAPTED ROUTES ---"
            docker exec cennomo-caddy-1 caddy adapt --config /etc/caddy/Caddyfile --pretty 2>&1 | sed -n "1,360p" || true
            echo "--- LOCAL EDGE REQUEST ---"
            curl -sk --resolve ohmium.167-99-74-236.sslip.io:443:127.0.0.1 -D - https://ohmium.167-99-74-236.sslip.io/celino-api/api/health || true'
