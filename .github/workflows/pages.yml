name: Verify Ohmium frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-check
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release
        run: |
          npm run build:models
          npm run check
          npm test
          npm run build:source
      - name: Build Pages bundle
        run: npm run build:pages
        env:
          OHMIUM_API_ORIGIN: ${{ vars.OHMIUM_API_ORIGIN }}
