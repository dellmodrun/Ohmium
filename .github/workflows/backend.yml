name: Deploy Ohmium backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ohmium-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release
        run: |
          npm run check
          npm test
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.OHMIUM_SSH_PRIVATE_KEY_B64 }}
          SERVER_HOST: ${{ vars.OHMIUM_SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/ohmium
          chmod 600 ~/.ssh/ohmium
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy Core and worker
        env:
          SERVER_HOST: ${{ vars.OHMIUM_SERVER_HOST }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > .release-commit
          tar --exclude=.git --exclude=node_modules --exclude=dist-pages --exclude=data --exclude=.env -czf /tmp/ohmium-release.tgz .
          scp -i ~/.ssh/ohmium /tmp/ohmium-release.tgz root@"$SERVER_HOST":/tmp/ohmium-release.tgz
          ssh -i ~/.ssh/ohmium root@"$SERVER_HOST" 'set -eu
            install -d /opt/ohmium
            tar -xzf /tmp/ohmium-release.tgz -C /opt/ohmium
            rm -f /tmp/ohmium-release.tgz
            cd /opt/ohmium
            sh deploy/bootstrap.sh
            sh deploy/install-caddy-route.sh'
      - name: Verify production API
        env:
          API_ORIGIN: ${{ vars.OHMIUM_API_ORIGIN }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$API_ORIGIN/api/health"; then exit 0; fi
            sleep 5
          done
          exit 1
